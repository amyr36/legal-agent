services:

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "1700:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Analysis pipeline data (context_A/context_B + FAISS indexes) lives in
      # backend/storage and is mounted here, separate from uploaded documents.
      ANALYSIS_STORAGE_DIR: /app/analysis_storage

    ports:
      - "8080:8000"

    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - ./backend/storage:/app/analysis_storage

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

volumes:
  postgres_data:
