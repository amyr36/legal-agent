services:

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "1700:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      ANALYSIS_STORAGE_DIR: /app/analysis_storage
      HF_HOME: /root/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"

    ports:
      - "8080:8000"

    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - ./backend/storage:/app/analysis_storage
      - hf_cache:/root/.cache/huggingface

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

  frontend:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "3000:80"

    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

volumes:
  postgres_data:
  hf_cache: